name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test C64 tools, emulator and BASIC interpreter
        run: |
          node test/tools.test.js
          node test/interp.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk c64-coder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: c64-coder-apk
          path: c64-coder.apk

      - name: Publish "latest" release (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest c64-coder.apk \
            --title "C64 Coder (latest build)" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Download c64-coder.apk on your Android phone and open it to install (allow installs from your browser or file manager when asked)." \
            --prerelease

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" c64-coder.apk --title "C64 Coder $GITHUB_REF_NAME" --generate-notes
